<div class="@container/player" style="--c-fg:#334455;--c-fg-muted:#667788">
  <div class="[grid-area:name]"><div><span>Synthetic Player</span></div></div>
  <div class="@container/skills"><div class="grid min-w-0 items-baseline gap-x-2 grid-cols-[minmax(0,max-content)_minmax(0,1fr)_auto]">
      <div class="flex min-w-0"><button id="pace"><span class="relative flex"><span>pace</span></span></button></div>
      <div class="min-w-0"><p style="color:var(--c-fg-muted)">very good</p></div>
      <div class="flex items-baseline gap-1"><div class="grid justify-items-end">
        <div class="invisible col-start-1 row-start-1"><span id="pace-measurement">18</span></div>
        <div class="col-start-1 row-start-1"><span id="pace-value" style="color:var(--c-fg)">10</span></div>
      </div></div>
    </div><span class="native-bar" style="background:#cc8844"><span style="background:#556677"></span></span>
    <div class="grid min-w-0 items-baseline gap-x-2 grid-cols-[minmax(0,max-content)_minmax(0,1fr)_auto]">
      <div class="flex min-w-0"><button id="passing"><span class="relative flex"><span>passing</span></span></button></div>
      <div class="min-w-0"><p style="color:var(--c-fg-muted)">very good</p></div>
      <div class="flex items-baseline gap-1"><div class="grid justify-items-end">
        <div class="invisible col-start-1 row-start-1"><span id="passing-measurement">18</span></div>
        <div class="col-start-1 row-start-1"><span id="passing-value" style="color:var(--c-fg)">9</span></div>
      </div></div>
    </div>
    <span class="native-bar" style="background:#cc8844"><span style="background:#556677"></span></span>
    <div class="grid min-w-0 items-baseline gap-x-2 grid-cols-[minmax(0,max-content)_minmax(0,1fr)_auto]">
      <div class="flex min-w-0"><button id="defending"><span class="relative flex"><span>defender</span></span></button></div>
      <div class="min-w-0"><p style="color:var(--c-fg-muted)">good</p></div>
      <div class="flex items-baseline gap-1"><div class="grid justify-items-end">
        <div class="invisible col-start-1 row-start-1"><span>18</span></div>
        <div class="col-start-1 row-start-1"><span id="defending-value" style="color:var(--c-fg)">7</span></div>
      </div></div>
    </div>
    <span class="native-bar" style="background:#556677"></span>
  </div>
</div>
